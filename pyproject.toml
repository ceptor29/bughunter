[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bughunter"
version = "0.1.0"
description = "Authorization-first, evidence-driven web security assessment framework"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27",
    "dnspython>=2.6",
    "pydantic>=2.14.1",
    "rich>=13.0",
    "typer>=0.12",
    "PyYAML>=6.0.3",
    "beautifulsoup4>=4.12",
    "websockets>=16.1.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "mypy>=2.3.1",
    "flask>=3.0",
    "build>=1.0",
    "twine>=7.0.0",
]

[project.scripts]
bughunter = "bughunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bughunter"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
